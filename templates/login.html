{% extends "base.html" %}
{% block content %}
<div class="admin-wrap">
  <div class="gate">
    <div class="lock">🔒</div>
    <h2>Administration</h2>
    <p>Dieser Bereich ist passwortgeschützt.</p>
    <form method="post" action="{{ url_for('login') }}">
      <input type="password" name="password" placeholder="Passwort" autocomplete="off" autofocus>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <button class="btn" type="submit" style="width:100%">Anmelden</button>
    </form>
  </div>
</div>

<script>
  // Cursor nach 30 s Inaktivität ausblenden; Rückkehr zur Anzeige nach 60 s
  (function () {
    var HIDE_MS = 30000, BACK_MS = 60000;
    var hideTimer, backTimer;
    function activity() {
      document.body.classList.remove("hide-cursor");
      clearTimeout(hideTimer);
      clearTimeout(backTimer);
      hideTimer = setTimeout(function () { document.body.classList.add("hide-cursor"); }, HIDE_MS);
      backTimer = setTimeout(function () { window.location.href = "{{ url_for('board') }}"; }, BACK_MS);
    }
    ["mousemove", "mousedown", "keydown", "touchstart", "click", "scroll", "wheel"].forEach(function (evt) {
      document.addEventListener(evt, activity, true);
    });
    activity();
  })();
</script>
{% endblock %}
